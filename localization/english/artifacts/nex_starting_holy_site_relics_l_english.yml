 artifact_relic_kerala_name: "Kollam Copper Plates"
 artifact_relic_kerala_desc: "Written in 840 AD, these copper plates enshrined the rights of Nasrani merchant, Mar Sapir Iso, to build a church in Kerala. With it came the protection of a local Hindu milita, several titles, and full aristroactic privleges. It established a precedent of Nasrani's playing important roles in local politics and practicing their faith freely."

 artifact_relic_nestorian_stele_name: "Nestorian Stele"
 artifact_relic_nestorian_stele_desc: "Erected in 781, this stele records the history of Christianity in China. It describes the efforts of missionary Alopen to be recognized by Tang Emperor Taizong."