l_english:
 syriac_rite: "East Syriac Rite"
 syriac_rite_adj: "East Syriac"
 syriac_rite_adherent: "East Syriac Christian"
 syriac_rite_adherent_plural: "East Syriac Christians"
 syriac_rite_desc: "The core of the Church of the East, the East Syriac Christians are a dominant minority in the Mesopotamian heartland. Despite never becoming a religious majority, it has used its protected religious status in the region to create a vast monastic network with which to proselytize throughout the Silk Road."

 zex_nasrani_rite: "Nasrani"
 zex_nasrani_rite_adj: "Nasrani"
 zex_nasrani_rite_adherent: "Nasrani"
 zex_nasrani_rite_adherent_plural: "Nasrani"
 zex_nasrani_rite_desc: "Also known as St. Thomas Christians, the Nasrani converted when St. Thomas the Apostle came to India in 52 AD. The Nasrani remain a small ethno-religious community of Indian Christians along the Malabar Coast, avoiding caste-based discrimination via religious exemption."

 zex_arkagun_rite: "Steppe Christianity"
 zex_arkagun_rite_adj: "Arkagun"
 zex_arkagun_rite_adherent: "Arkagun"
 zex_arkagun_rite_adherent_plural: "Arkaguns"
 zex_arkagun_rite_desc: "In an effort by Nestorians to spread Christianity into the steppes, concessions were made that honored and preserved aspects of Steppe culture and Tengriist folklore. These Steppe Christians, known as Arkaguns, could still take concubines and worship their ancestors as long as priests blessed these ceremonies instead of shamans."

 zex_jingjiao_rite: "Jingjiao"
 zex_jingjiao_rite_adj: "Jingjiao"
 zex_jingjiao_rite_adherent: "Jingjiao-tu"
 zex_jingjiao_rite_adherent_plural: "Jingjiao-tu"
 zex_jingjiao_rite_desc: "Directly translating as 'The Luminous Religion', the light of Christ reached China through missionary Alopen where it became known as Jingjiao. Alopen secured the patronage of Emperor Taizong of the Tang Dynasty and spread Jingjiao amongst the intellectual elties using the language of Daoist, Buddhist, and Confucian philosophy."

 zex_socotran_rite: "Socotran Christianity"
 zex_socotran_rite_adj: "Socotran Christian"
 zex_socotran_rite_adherent: "Socotran Christian"
 zex_socotran_rite_adherent_plural: "Socotran Christians"
 zex_socotran_rite_desc: "Due to limited oversight by the Church of East, the Christians on Socotra became isolated from the Christian world. Often mixing in their cultural pagan tradaitions with Christian teaching under the nose of assigned Nestorian bishops. Though when tested by God with the threat of Muslim rule around 863 AD the Socotran Christians revolted, leaving the island with no formal ruler but instead only a community of peasents; isolated from Christendom and still clinging to their old ways."

 nex_antiochian_west_syriac_description: "The Patriarchate of Antioch is one of the oldest Christian communities, founded by St. Peter and St. Paul the Apostles. Following reconciliation with the Church of the East, its faithful uphold the East Syriac confession while preserving their West Syriac tradition and the ancient liturgy of St. James."