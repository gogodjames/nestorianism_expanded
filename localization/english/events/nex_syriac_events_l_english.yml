l_english:
 nex_syriac_events.0001.t: "The Syriac Churches Reunited"
 nex_syriac_events.0001.desc: "Word spread around all of Christendom, the division between the Antiochian Jacobites of the Syriac Orthodox Church and the Church of the East has been brought to an end.\n\nThrough [GetGlobalVariable('nex_uniter_of_syriac_churches').Char.GetTitledFirstNamePossessiveOrMy] efforts, Antioch has accepted a common dyophysite confession with the eastern faithful while preserving its West Syriac liturgy of St. James. Churches long separated by controversy over Christ's nature now stand together in communion.\n\nAcross Christendom, rulers and clergy consider what this reconciliation will mean for the Christian East."
 nex_syriac_events.0001.a: "A new chapter for Christianity."
 nex_syriac_events.0001.b: "The Syriacs seem to be doing well"
 nex_syriac_events.0001.c: "We hope our wayward brothers will return to us and the Miaphysite Churches"
