l_english:
 nex_random.1.t: "Christian Refugees from China"
 nex_random.1.desc: "I find [faithful_head.GetFirstName] in the courtyard, repairing the binding of a seemingly decades old book. Nearby, [faithful_head.GetHerHis] companions divide a loaf among themselves.\n\nThe priest rises when I approach and explains that they are Christians from [GetTitleByKey('h_china').GetNameNoTier], seeking a new home after their displacement on the orders of [GetScriptedCharacterByHistoryID('han_3139').GetFullName].\n\n #emp \"In China, our teaching is called [faithful_head.GetRite.GetName], or in your language, the Luminous Religion.\"#! [faithful_head.GetSheHe] explains.\n#emp \"Our churches were closed and our brethren scattered, give us somewhere to settle, and we will earn our bread.\"#!\n\nIt's up to me to decide their fates."
 nex_random.1.a: "Tell me more about this 'Jingjiao'"
 nex_random.1.b: "They may settle in the realm, provided they stay loyal."
 nex_random.1.c: "We welcome our brothers in faith, as good Christians should."
 nex_random.1.c.reason: "Because you are [ROOT.Char.GetFaith.GetName]"
 nex_random.1.settle_domain: "The refugees settle in your capital and selected counties of your personal domain, adopting the Jingjiao rite. Each settled county gains #P 1#! Development and loses #N 5#! Control. Each has a #V 20%#! chance to adopt Han culture, except your capital, which retains its culture."
 nex_random.1.settle_duchy: "The refugees settle in selected counties of [nex_refugee_duchy.GetName], adopting the Jingjiao rite. Each settled county gains #P 1#! Development and loses #N 5#! Control, with a #V 20%#! chance to adopt Han culture."
 nex_random.1.d: "Forget the rabble, I could use someone like [faithful_head.GetFirstNameNoTooltip]."
 nex_random.1.d.tt: "There is a chance [faithful_head.GetSheHe] may deny your request"
 nex_random.1.d.refused: "[faithful_head.GetFirstNameNoTooltip] declines your offer and continues the journey."
 nex_random.1.e: "Their troubles are over, slaughter these [ROOT.Char.Custom('GetDerogatoryNonbelieverPlural')]."
 nex_random.1.f: "I do not care, send them back to the roads."
