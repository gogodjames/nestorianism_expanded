l_english:
  # Base building 
  building_type_saint_thomas_mount_01: "Saint Thomas Mount"
  building_type_saint_thomas_mount_01_desc: "The site of St. Thomas the Apostle's martyrdom. Struck by spears in 72 AD the site of his death has become a place of worship for Nestorian pilgrims and local Nasranis."

  # Level 1 
  saint_thomas_mount_01: "Saint Thomas Mount"
  saint_thomas_mount_01_desc: "A humble shrine built upon the sacred mount by local Nasranis venerating the martyrdom of their namesake and founder. From up here, the beauty of God's creation stands in contrast to the tragedy of Thomas' death."

  # Level 2 
  saint_thomas_mount_02: "Our Lady of the Mount"
  saint_thomas_mount_02_desc: "Due to the influx of Nestorian pilgrims, the Our Lady of the Mount Church has been established to serve the faithful. Beyond the metaphorical sense, the church has also become a literal lighthouse; helping those who were once lost be found in the light of God."
